# Compile check for Linux and macOS. The recompiled games need the player's ROMs, so CI builds
# everything around them (RT64, the runtime, the frontend and main.cpp) with stand-ins for the
# ROM-derived files. setup.sh does the full build on the player's machine.
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libsdl2-dev libgtk-3-dev libx11-dev libxrandr-dev
      - if: runner.os == 'macOS'
        run: brew install ninja sdl2
      - run: |
          for t in N64ModernRuntime rt64; do git clone -q --recurse-submodules --branch rampage https://github.com/sp00nznet/$t deps/$t; done
          mkdir -p gen/wt && touch gen/wt/recomp_overlays.inl gen/wt/lookup.cpp rsp/aspMain_wt.cpp
          echo 'int recomp_stand_in;' > gen/wt/funcs_0.c
      - run: |
          compilers=; [ "$RUNNER_OS" = Linux ] && compilers="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRAMPAGE_GAME=wt $compilers
          cmake --build build --target n64frontend CMakeFiles/RampageWorldTour.dir/src/main.cpp.o
