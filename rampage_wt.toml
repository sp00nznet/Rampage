# Game fixes that have to sit inside recompiled functions. Each hook's text is inserted before the
# instruction at before_vram; the helpers it calls live in src/wt_stubs.c (declared in src/hooks.h).

# Graphics task builder: the scheduler can run it before its task pointer is set.
[[patches.hook]]
func = "func_800611A0"
before_vram = 0x80061244
text = "if ((uint32_t)ctx->r24 == 0) { ctx->r13 = MEM_W(0x60, ctx->r29); goto L_800612C0; }"

[[patches.hook]]
func = "func_800611A0"
before_vram = 0x800612F8
text = "if ((uint32_t)ctx->r14 == 0) { ctx->r4 = ADD32(ctx->r17, 0xE4); goto L_80061374; }"

[[patches.hook]]
func = "func_800611A0"
before_vram = 0x80061384
text = "if ((uint32_t)ctx->r11 == 0) { goto L_80061414; }"

# Controller reader: the game's state transitions clear the per-player button maps, so
# rewrite them every frame, and treat player 1 as active so its map is used in gameplay.
[[patches.hook]]
func = "func_80068D0C"
before_vram = 0x80068D24
text = "wt_write_button_maps(rdram);"

[[patches.hook]]
func = "func_80068D0C"
before_vram = 0x80068D94
text = "if ((ctx->r17 & 0xFFFF) == 0) { ctx->r24 = 0; }"

# Controller pak setup, empty slot: record "no pak" (PFS_ERR_NOPACK, what osPfsInitPak itself would
# answer) as the slot's error. Left at 0, the game's pak layer reports success for the empty slot,
# "loads" an all-zero save record and applies its settings: music and effects volume 0.
[[patches.hook]]
func = "func_80062CC8"
before_vram = 0x80062D08
text = "wt_no_pak(rdram, ctx);"
